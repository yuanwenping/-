version: '2.1'

volumes:
  pgdata:
  walletstore:

networks:
  mynetwork:
    external:
      name: trace4_test

services:
  explorerdb:
    image: postgres:11
    container_name: explorerdb
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/1_explorerpg.sql:/docker-entrypoint-initdb.d/1_explorerpg.sql
      - ./postgres/2_updatepg.sql:/docker-entrypoint-initdb.d/2_updatepg.sql
    healthcheck:
      test: ["CMD-SHELL", "psql -U postgres -d fabricexplorer -c 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - mynetwork

  explorer:
    image: hyperledger/explorer:1.1.8
    container_name: explorer
    environment:
      - DATABASE_HOST=explorerdb
      - DATABASE_PORT=5432
      - DATABASE_DATABASE=fabricexplorer
      - DATABASE_USERNAME=hppoc
      - DATABASE_PASSWD=password
      - LOG_LEVEL_APP=info
      - LOG_LEVEL_DB=info
      - LOG_LEVEL_CONSOLE=debug
      - LOG_CONSOLE_STDOUT=true
      - DISCOVERY_AS_LOCALHOST=false
    volumes:
      - ./config.json:/opt/explorer/app/platform/fabric/config.json
      - ./connection-profile:/opt/explorer/app/platform/fabric/connection-profile
      - ./FabricGateway.js:/opt/explorer/app/platform/fabric/gateway/FabricGateway.js:ro
      - /home/yuan/fabric-four-peers/organizations:/tmp/crypto
      - walletstore:/opt/explorer/wallet
    ports:
      - "8080:8080"
    depends_on:
      explorerdb:
        condition: service_healthy
    networks:
      - mynetwork
